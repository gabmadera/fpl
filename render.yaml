services:
  - type: web
    name: fpl-ai-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.web_ui_clean:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"
    healthCheckPath: /health