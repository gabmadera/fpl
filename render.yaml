services:
  - type: web
    name: fpl-ai-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MODEL_PATH
        value: "models/2025_26"
      - key: DATA_PATH
        value: "data"
    healthCheckPath: /cloud/health